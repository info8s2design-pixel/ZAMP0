body.configured #app{position:relative;z-index:1}
@media print{body.configured::before{display:none}}

/* ZAMP0 v1.0.14: cartoon illustrations for Add and Other */
.zcartoon{width:64px;height:64px;display:block;flex-shrink:0;filter:drop-shadow(0 2px 1px #00000012)}
.z-altro-card{display:flex;align-items:center;gap:18px;border:2px solid color-mix(in srgb,var(--main) 38%,var(--line));border-radius:24px;background:var(--card);min-height:176px;padding:19px 22px}
.z-altro-card .z-card-icon{width:78px;height:78px;flex-shrink:0;display:grid;place-items:center;border-radius:20px;background:var(--soft)}
.z-altro-card .z-card-content{min-width:0;flex:1}
.z-altro-card .btn{border:1px solid var(--main);border-radius:13px;background:var(--soft);color:var(--ink)}
.z-quick{gap:10px}.z-quick-btn{width:100%;display:flex;align-items:center;text-align:left;gap:16px;border:2px solid color-mix(in srgb,var(--main) 40%,var(--line));border-radius:19px;background:var(--card);color:var(--ink);padding:9px 16px;font-weight:900;font-size:1.05rem;min-height:78px}
.z-quick-btn .zcartoon{width:54px;height:54px}.z-quick-btn.primary{background:var(--main);color:white;border-color:var(--main)}
.z-quick-arrow{margin-left:auto;font-size:2rem;font-weight:400;opacity:.75}
.z-quick-btn:hover,.z-altro-card:hover{box-shadow:0 5px 20px #00000012}
@media(max-width:690px){.z-altro-grid{grid-template-columns:1fr!important}.z-altro-card{min-height:124px;padding:14px}.z-altro-card .z-card-icon{width:66px;height:66px}.z-altro-card .zcartoon{width:54px;height:54px}.z-quick-btn{min-height:72px}}

/* ZAMP0 v1.0.14 — schermata vuota Animali */
.pets-empty{min-height:clamp(340px,57vh,590px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px 16px 70px}
.pets-empty-art{font-size:clamp(150px,19vw,245px);line-height:1.18;filter:drop-shadow(0 12px 14px #344c3522);user-select:none}
.pets-empty h3{font-size:clamp(1.25rem,2vw,1.65rem);margin:0;color:var(--ink)}
.pets-empty p{font-size:1.05rem;color:var(--muted);margin:0}
.pets-empty-button{margin-top:7px;border-radius:16px;padding:13px 24px}
@media(max-width:780px){.pets-empty{min-height:clamp(340px,54vh,510px);padding-bottom:45px}.pets-empty-art{font-size:clamp(150px,35vw,180px)}}

/* Icone cartoon coordinate anche nei titoli dei sottomenu */
.z-modal-title{display:inline-flex;align-items:center;gap:12px;vertical-align:middle}.z-modal-title .zcartoon{width:44px;height:44px;flex:none;vertical-align:middle}.modal-head h2:has(.z-modal-title){display:flex;align-items:center}
.z-hero-pets{display:inline-flex;width:100px;max-width:30%;flex-shrink:0}.z-hero-pets svg{width:100%;height:auto}@media(max-width:520px){.z-hero-pets{width:76px}}
 .zcartoon-pet{object-fit:contain;vertical-align:middle;background:transparent} 
/* v1.0.28: dimensioni fisse icona Animali, testo sempre allineato */
.nav{display:flex;align-items:center;gap:12px;min-width:0}
.nav .zamp-animals-menu-icon{display:block;width:52px;height:52px;max-width:52px;object-fit:contain;flex:0 0 52px}
.mobile-nav .zamp-animals-menu-icon{display:block;width:27px;height:27px;max-width:27px;object-fit:contain}
.mobile-nav b{min-width:0;max-width:100%;overflow:hidden}
@media(max-width:780px){.nav .zamp-animals-menu-icon{width:27px;height:27px}}
 .z-hero-pets-new{display:block;width:100%;height:auto;object-fit:contain} 
/* v1.0.28: carta d'identità */
.z-identity-card{border:2px solid #a66c36;border-radius:20px;padding:18px;background:#fff9f0;color:#4c2c1a}
.z-id-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#8d552d;letter-spacing:.04em}
.z-id-main{display:flex;align-items:center;gap:16px;margin:16px 0}.z-id-main h2{font-size:27px;margin:0}.z-id-main p{margin:4px 0}
.z-id-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.z-id-grid div{display:flex;flex-direction:column;gap:4px;padding:10px;background:#fff0de;border-radius:10px;overflow-wrap:anywhere}.z-id-grid b,.z-id-note b{font-size:12px;color:#81502d}.z-id-note{margin-top:12px;padding:10px;border-top:1px solid #dbc4aa}.z-id-note p{margin:5px 0}
@media(max-width:500px){.z-id-grid{grid-template-columns:1fr}.z-id-top{flex-wrap:wrap}.z-id-main .avatar{width:85px;height:85px}}

/* v1.0.30: icona Animale coerente con Oggi, senza deformazioni */
.z-quick-btn .zcartoon-pet{width:54px;height:54px;max-width:54px;flex:0 0 54px;object-fit:contain;display:block}
.z-quick-btn span:not(.z-quick-arrow){min-width:0}
@media(max-width:480px){.z-quick-btn .zcartoon-pet{width:44px;height:44px;max-width:44px;flex-basis:44px}}

/* v1.0.37 — header compatto: elimina lo spazio vuoto sopra le schermate */
body.configured .top{min-height:0;align-items:center;margin-bottom:12px}
body.configured .top .header-logo{display:block;width:auto;max-width:165px;height:64px;max-height:64px;object-fit:contain;object-position:left center}
body.configured .top .brand{min-width:0;align-items:center}
@media(max-width:780px){body.configured .top{margin-bottom:10px}body.configured .top .header-logo{height:52px;max-height:52px;max-width:135px}}
@media print{body.configured .top .header-logo{height:52px}}

.z-pets-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}

.z-pet-detail .z-detail-head .avatar.lg{width:140px;height:140px;border-radius:22px;font-size:4rem}
.z-pet-detail .z-detail-head h2{font-size:1.65rem}
.z-pet-detail .notice{padding:17px;min-height:85px}
.z-pet-detail .z-detail-empty .empty{padding:20px 12px}

function goto(p){page=p;render();window.scrollTo(0,0)}
function petName(id){return state.pets.find(x=>x.id===id)?.name||'Animale eliminato'}
function avatar(p,large=false){return p?.photo?`<img class="avatar ${large?'lg':''}" src="${p.photo}" alt="Foto di ${esc(p.name)}">`:`<span class="avatar ${large?'lg':''}">${speciesEmoji(p?.species)}</span>`}
function btn(label,fn,cls=''){return `<button type="button" class="btn ${cls}" data-action="${fn}">${label}</button>`}
function empty(text,emoji='🐾'){return `<div class="empty"><span class="emoji">${emoji}</span>${text}</div>`}
function render(){applyTheme();if(!state.configured){renderOnboard();return}$('#app').innerHTML=`<div class="shell"><header class="top"><div class="brand"><img class="header-logo" src="${LOGO}" alt="ZAMP0 — Tutto il loro mondo, in un’app."></div><div class="top-actions"><button class="btn alt sm" data-action="quick">＋ Nuovo</button></div></header><div class="layout"><nav class="sidebar">${nav.map(([k,i,l])=>`<button class="nav ${page===k?'active':''}" data-go="${k}">${i} &nbsp; ${l}</button>`).join('')}</nav><main class="main" id="main">${views[page]()}</main></div></div><nav class="mobile-nav" aria-label="Menu principale">${nav.map(([k,i,l])=>`<button class="${page===k?'active':''}" data-go="${k}" aria-label="${l}"><b>${i}</b>${l}</button>`).join('')}</nav>`}
function renderOnboard(){let step=Number(sessionStorage.getItem('zamp-step')||0);$('#app').innerHTML=`<div class="onboard"><div class="card">${step===0?`<img class="logo-large" src="${LOGO}" alt="Logo ZAMP0"><h2>Benvenuto in ZAMP0</h2><p class="muted" style="margin:14px 0">Il libretto digitale dei tuoi animali: salute, appuntamenti, alimentazione, spese e ricordi, sempre con te.</p><div class="notice">I dati rimangono sul dispositivo. Ricorda di esportare periodicamente un backup.</div><p style="margin-top:18px">${btn('Iniziamo →','onboardNext')}</p>`:step===1?`<h2>Come ti chiami?</h2><p class="muted">Personalizziamo il tuo spazio.</p><form id="owner-form"><label>Il tuo nome<input name="owner" required maxlength="70" value="${esc(state.owner)}" placeholder="Nome"></label><label>Palette predefinita<select name="palette"><option value="natura">Natura · salvia e terracotta</option><option value="pesca">Pesca</option><option value="oceano">Oceano</option><option value="mono">Monocromatica</option></select></label><button class="btn" style="width:100%;margin-top:10px">Continua →</button></form>`:`<h2>Il tuo primo animale 🐾</h2><p class="muted">Puoi aggiungerlo ora oppure più tardi.</p><div class="actions" style="justify-content:center;margin-top:20px">${btn('＋ Aggiungi animale','firstPet')}${btn('Lo farò dopo','finishOnboard','alt')}</div>`}</div></div>`}
function head(title,sub,action=''){return `<div class="heading"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function upcoming(){return state.records.filter(r=>r.date>=today()&&!r.done).sort((a,b)=>a.date.localeCompare(b.date))}
function petAge(birth){if(!birth)return 'Età non indicata';const d=new Date(birth+'T12:00:00'),n=new Date();if(isNaN(d)||d>n)return 'Età non indicata';let y=n.getFullYear()-d.getFullYear();let m=n.getMonth()-d.getMonth();if(n.getDate()<d.getDate())m--;if(m<0){y--;m+=12}return y?y+' '+(y===1?'anno':'anni'):(m?m+' '+(m===1?'mese':'mesi'):'Meno di un mese')}

animali(){return `${head('I tuoi animali','Cani, gatti e qualsiasi altra specie personalizzabile.',btn('＋ Nuovo animale','petNew'))}${state.pets.length?`<div class="grid z-pets-grid">${state.pets.map(petCard).join('')}</div>`:`<div class="pets-empty"><div class="pets-empty-art" aria-hidden="true">🐶</div><h3>Il tuo primo amico ti aspetta!</h3><p>Aggiungi il tuo primo animale</p><button type="button" class="btn pets-empty-button" data-action="petNew">＋ Aggiungi animale</button></div>`}`},
salute(){let tabs=['Tutti','Vaccino','Visita','Farmaco','Antiparassitario','Peso','Esame','Intervento','Altro'];let rows=state.records.filter(r=>(healthTab==='Tutti'||r.type===healthTab)&&(!filterPet||r.petId===filterPet)).sort((a,b)=>b.date.localeCompare(a.date));return `${head('Salute e libretto','Visite, vaccinazioni, terapie e misurazioni.',btn('＋ Registrazione','recordNew'))}<div class="filters"><select id="pet-filter"><option value="">Tutti gli animali</option>${petOptions(filterPet)}</select></div><div class="tabs">${tabs.map(t=>`<button class="${healthTab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')}</div><div class="card">${rows.length?rows.map(recordRow).join(''):empty('Nessuna registrazione in questa categoria','♡')}</div><p class="muted" style="margin-top:12px;font-size:.8rem">Le registrazioni sanitarie sono un archivio personale e non sostituiscono le indicazioni del veterinario.</p>`},
agenda(){let y=agendaMonth.getFullYear(),m=agendaMonth.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();let cells=Array.from({length:first},()=>'<span></span>');for(let d=1;d<=days;d++){let date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,count=state.records.filter(r=>r.date===date&&(!filterPet||r.petId===filterPet)).length;cells.push(`<button class="day ${count?'has':''} ${date===today()?'today':''}" data-action="day:${date}"><b>${d}</b><div>${Array.from({length:Math.min(count,4)},()=>'<i class="dot"></i>').join('')}</div></button>`)}return `${head('Agenda','Tutti gli appuntamenti e le scadenze.',btn('＋ Appuntamento','recordNew'))}<div class="filters"><select id="pet-filter"><option value="">Tutti gli animali</option>${petOptions(filterPet)}</select></div><div class="card"><div class="heading"><button class="btn alt sm" data-action="monthPrev">‹</button><h2>${new Date(y,m,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'})}</h2><button class="btn alt sm" data-action="monthNext">›</button></div><div class="month">${['L','M','M','G','V','S','D'].map(x=>`<strong style="text-align:center">${x}</strong>`).join('')}${cells.join('')}</div></div><div class="section"><h2>Scadenze future</h2></div><div class="card">${upcoming().filter(r=>!filterPet||r.petId===filterPet).slice(0,20).map(recordRow).join('')||`<div class="empty"><svg width="64" height="64" style="display:block;margin:0 auto 12px" viewBox="0 0 64 64" role="img" aria-label="Agenda"><rect x="7" y="12" width="50" height="46" rx="8" fill="#fff6e6" stroke="#5a3925" stroke-width="3"/><path d="M7 26V19q0-7 8-7h34q8 0 8 7v7" fill="#e99a3f" stroke="#5a3925" stroke-width="3"/><path d="M19 7v13m26-13v13" stroke="#5a3925" stroke-width="5" stroke-linecap="round"/><g fill="#edc88e"><rect x="15" y="32" width="10" height="9" rx="2"/><rect x="29" y="32" width="10" height="9" rx="2"/><rect x="15" y="45" width="10" height="8" rx="2"/></g><circle cx="44" cy="47" r="5" function petOptions(selected=''){return state.pets.map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
function recordRow(r){return `<div class="item"><div><strong>${esc(r.title||r.type)}</strong><div class="meta">${fmt(r.date)} · ${esc(petName(r.petId))} · ${esc(r.type)} ${r.done?'· ✓ Completato':''}</div>${r.note?`<small>${esc(r.note)}</small>`:''}</div><div class="actions">${r.date>=today()&&!r.done?btn('✓','recordDone:'+r.id,'alt sm'):''}${btn('Modifica','recordEdit:'+r.id,'outline sm')}</div></div>`}
function modal(title,content,footer=''){if(modalCleanup)modalCleanup();$('#modal-root').innerHTML=`<div class="modal-back" id="overlay"><section class="modal ${title.startsWith('Scheda di ')?'z-pet-detail':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button class="close" data-action="close" aria-label="Chiudi">✕</button></div>${content}${footer}</section></div>`;$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()})}
function closeModal(){if(modalCleanup){modalCleanup();modalCleanup=null}$('#modal-root').replaceChildren()}
function field(name,label,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function selectField(name,label,items,value=''){return `<label>${label}<select name="${name}">${items.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}
function formButtons(deleteAction=''){return `<div class="modal-foot">${deleteAction?btn('Elimina',deleteAction,'danger'):''}${btn('Annulla','close','alt')}<button class="btn" type="submit">Salva</button></div>`}
function petForm(id=''){let p=state.pets.find(x=>x.id===id)||{};modal(id?'Modifica animale':'Nuovo animale',`<form id="pet-form" class="stack"><div class="form-grid">${field('name','Nome *',p.name,'text','required maxlength="70"')}${selectField('species','Specie',['Cane','Gatto','Coniglio','Uccello','Pesce','Tartaruga','Roditore','Rettile','Altra specie'],p.species||'Cane')}${field('customSpecies','Specie personalizzata',p.customSpecies)}${field('breed','Razza / varietà',p.breed)}${selectField('sex','Sesso',['Non indicato','Maschio','Femmina'],p.sex||'Non indicato')}${field('birth','Data di nascita',p.birth,'date')}${field('color','Colore / segni particolari',p.color)}${field('microchip','Microchip / identificativo',p.microchip)}${field('vet','Veterinario',p.vet)}${field('vetPhone','Telefono veterinario',p.vetPhone,'tel')}${field('allergies','Allergie / attenzioni',p.allergies)}${field('weight','Peso attuale (kg)',p.weight,'number','step="0.01" min="0"')}<label class="wide">Foto (facoltativa, max 2 MB)<input name="photo" type="file" accept="image/*"></label><label class="wide">Note<textarea name="note">${esc(p.note)}</textarea></label></div>${formButtons(id?'petDelete:'+id:'')}</form>`);$('#pet-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),o={...p};for(let k of ['name','species','customSpecies','breed','sex','birth','color','microchip','vet','vetPhone','allergies','weight','note'])o[k]=String(f.get(k)||'').trim();if(o.species==='Altra specie'&&o.customSpecies)o.species=o.customSpecies;let file=f.get('photo');if(file?.size){if(file.size>2e6)return toast('La foto supera 2 MB');o.photo=await fileData(file)}o.id=id||uid();if(id)state.pets=state.pets.map(x=>x.id===id?o:x);else state.pets.push(o);await save();closeModal();render();toast('Scheda animale salvata')}}
function petDetail(id){let p=state.pets.find(x=>x.id===id);if(!p)return;let rec=state.records.filter(r=>r.petId===id).sort((a,b)=>b.date.localeCompare(a.date));modal('Scheda di '+esc(p.name),`<div class="petrow z-detail-head">${avatar(p,true)}<div><h2>${esc(p.name)}</h2><p class="muted">${esc(p.species)} ${p.breed?'· '+esc(p.breed):''}</p><small>${p.birth?'Nato/a il '+fmt(p.birth):''}</small></div></div><div class="grid two" style="margin:16px 0"><div class="notice"><b>Microchip</b><p>${esc(p.microchip||'Non indicato')}</p></div><div class="notice"><b>Peso</b><p>${esc(p.weight||'—')} ${p.weight?'kg':''}</p></div><div class="notice"><b>Veterinario</b><p>${esc(p.vet||'Non indicato')}</p></div><div class="notice"><b>Allergie</b><p>${esc(p.allergies||'Nessuna informazione')}</p></div></div>${p.note?`<p>${esc(p.note)}</p>`:''}<div class="section"><h3>Ultime registrazioni</h3></div>${rec.slice(0,5).map(recordRow).join('')||'<div class="z-detail-empty">'+empty('Nessuna registrazione','♡')+'</div>'}<div class="actions" style="margin-top:15px">${btn('Modifica','petEdit:'+id)}${btn('＋ Evento','recordNew:'+id,'alt')}${btn('Carta d’identità','identity:'+id,'outline')}${btn('Controllo del peso','weight:'+id,'alt')}${btn('Stampa scheda','printPet:'+id,'outline')}</div>`)}
function recordForm(id='',presetPet='',presetDate=''){let r=state.records.find(x=>x.id===id)||{};if(!state.pets.length)return toast('Aggiungi prima un animale');modal(id?'Modifica registrazione':'Nuova registrazione',`<form id="record-form" class="stack"><div class="form-grid"><label>Animale<select name="petId">${petOptions(r.petId||presetPet||state.pets[0].id)}</select></label>${selectField('type','Categoria',['Vaccino','Visita','Farmaco','Antiparassitario','Peso','Esame','Intervento','Toelettatura','Promemoria','Altro'],r.type||'Visita')}${field('title','Titolo *',r.title,'text','required maxlength="100"')}${field('date','Data *',r.date||presetDate||today(),'date','required')}${field('nextDate','Prossimo richiamo (facoltativo)',r.nextDate,'date')}${field('amount','Costo (€), facoltativo',r.amount,'number','min="0" step="0.01"')}<label class="wide">Note, prescrizioni o dettagli<textarea name="note">${esc(r.note)}</textarea></label><label class="wide" style="display:flex;flex-direction:row;align-items:center"><input style="width:auto" type="checkbox" name="done" ${r.done?'checked':''}> Completato</label></div><div class="notice">Inserisci farmaci e dosaggi soltanto secondo le indicazioni del veterinario.</div>${formButtons(id?'recordDelete:'+id:'')}</form>`);$('#record-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),o={...r};for(let k of ['petId','type','title','date','nextDate','amount','note'])o[k]=String(f.get(k)||'').trim();o.done=f.has('done');o.id=id||uid();if(id)state.records=state.records.map(x=>x.id===id?o:x);else state.records.push(o);if(o.nextDate&&o.nextDate!==o.date&&!id){state.records.push({id:uid(),petId:o.petId,type:o.type,title:'Richiamo: '+o.title,date:o.nextDate,note:'Scadenza generata dalla registrazione',done:false})}await save();closeModal();render();toast('Registrazione salvata')}}
function fileData(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file)})}

function printIdentity(id){const p=state.pets.find(p=>p.id===id);if(!p)return;const w=window.open('','_blank');if(!w)return toast('Consenti l’apertura della finestra di stampa');const css=document.querySelector('#zamp-identity-css')?.textContent||'';w.document.write(`<html lang="it"><head><meta charset="utf-8"><title>Carta identità - ${esc(p.name)}</title><style>body{font-family:system-ui,sans-serif;color:#4c2c1a;max-width:780px;margin:35px auto;padding:15px}.z-id-top{display:flex;justify-content:space-between}.z-id-main{display:flex;gap:20px;align-items:center}.avatar{width:115px;height:115px;object-fit:cover;border-radius:20px}.z-id-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.z-id-grid div{display:flex;flex-direction:column;padding:8px;background:#fff5e8;border-radius:8px}.z-id-note{margin-top:16px}.z-identity-card{border:2px solid #a66c36;border-radius:20px;padding:22px} ${css}</style><style id="zamp-logo-no-crop">body.configured .top .header-logo{width:210px!important;max-width:min(210px,45vw)!important;height:auto!important;max-height:none!important;object-fit:contain!important;overflow:visible!important;display:block!important}.top .brand{overflow:visible!important;min-width:0!important}.logo-large{object-fit:contain!important;height:auto!important;max-height:none!important}@media(max-width:780px){body.configured .top .header-logo{width:165px!important;max-width:42vw!important;height:auto!important;max-height:none!important}}</style></head><body>${identityMarkup(p)}<p style="font-size:12px">Documento informativo non ufficiale · ZAMP0</p></body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),350)}
function weightList(id){return (state.weights||[]).filter(r=>r.petId===id).sort((a,b)=>a.date.localeCompare(b.date))}
function weightChart(rows){if(!rows.length)return '<p class="muted">Registra la prima misurazione per visualizzare il grafico.</p>';const vals=rows.map(r=>Number(r.kg));let lo=Math.min(...vals),hi=Math.max(...vals);const spread=Math.max(hi-lo,0.5);lo=Math.max(0,lo-spread*.15);hi=hi+spread*.15;const points=rows.map((r,i)=>{let x=rows.length===1?310:48+i*524/(rows.length-1);let y=190-(Number(r.kg)-lo)/(hi-lo)*150;return [x,y]});const poly=points.map(p=>p.join(',')).join(' ');return `<svg viewBox="0 0 620 235" role="img" aria-label="Grafico del peso in chilogrammi" style="width:100%;height:auto;max-height:260px"><line x1="48" y1="40" x2="48" y2="190" stroke="#cbb9a4"/><line x1="48" y1="190" x2="572" y2="190" stroke="#cbb9a4"/><text x="4" y="43" fill="currentColor" font-size="15">${hi.toFixed(1)}</text><text x="4" y="190" fill="currentColor" font-size="15">${lo.toFixed(1)}</text>${points.length>1?`<polyline points="${poly}" fill="none" stroke="#b56d38" stroke-width="4" stroke-linejoin="round"/>`:''}${points.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="#e89b54" stroke="#633b1e" stroke-width="2"><title>${rows[i].date}: ${rows[i].kg} kg</title></circle>`).join('')}<text x="48" y="217" fill="currentColor" font-size="13">${esc(rows[0].date)}</text><text x="572" y="217" text-anchor="end" fill="currentColor" font-size="13">${esc(rows[rows.length-1].date)}</text></svg>`}
function showWeights(id){const p=state.pets.find(p=>p.id===id);if(!p)return;const rows=weightList(id),last=rows.at(-1);modal('Controllo del peso · '+esc(p.name),`<div class="notice"><b>Ultimo peso:</b> ${last?esc(last.kg)+' kg · '+fmt(last.date):p.weight?esc(p.weight)+' kg (scheda animale)':'Non ancora registrato'}</div><div style="margin:15px 0">${weightChart(rows)}</div><form id="z-weight-form" class="form-grid"><input type="hidden" name="petId" value="${esc(id)}">${field('date','Data',today(),'date','required')}${field('kg','Peso (kg)','', 'number','required min="0.01" max="10000" step="0.01"')}<div class="wide"><button class="btn" type="submit">＋ Registra peso</button></div></form><h3 style="margin:18px 0 8px">Storico misurazioni</h3>${rows.length?[...rows].reverse().map(r=>`<div class="item"><div><strong>${esc(r.kg)} kg</strong><div class="meta">${fmt(r.date)}</div></div>${btn('Elimina','weightDelete:'+id+':'+r.id,'outline sm')}</div>`).join(''):empty('Nessuna misurazione')}<div class="modal-foot">${btn('Chiudi','close','alt')}</div>`);$('#z-weight-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),kg=Number(f.get('kg')),date=String(f.get('date')||'');if(!Number.isFinite(kg)||kg<=0||kg>10000||!/^\d{4}-\d\d-\d\d$/.test(date))return toast('Inserisci data e peso validi');state.weights=state.weights||[];state.weights.push({id:uid(),petId:id,date,kg:String(kg)});const last=weightList(id).at(-1);p.weight=last.kg;await save();render();showWeights(id);toast('Peso registrato')}}
async function deleteWeight(id,rid){if(!confirm('Eliminare questa misurazione?'))return;state.weights=(state.weights||[]).filter(r=>r.id!==rid);const p=state.pets.find(p=>p.id===id),last=weightList(id).at(-1);if(p&&last)p.weight=last.kg;await save();render();showWeights(id)}

document.addEventListener('click',e=>{let el=e.target.closest('[data-action],[data-go],[data-tab]');if(!el)return;if(el.dataset.action)handleAction(el.dataset.action);else if(el.dataset.go)goto(el.dataset.go);else if(el.dataset.tab){healthTab=el.dataset.tab;render()}});
document.addEventListener('change',e=>{if(e.target.id==='pet-filter'){filterPet=e.target.value;render()}else if(e.target.id==='restore-file'&&e.target.files[0])restore(e.target.files[0])});
document.addEventListener('submit',e=>{if(e.target.id==='owner-form'){e.preventDefault();let f=new FormData(e.target);state.owner=String(f.get('owner')||'').trim();if(!state.owner)return;state.palette=f.get('palette');state.dark=false;sessionStorage.setItem('zamp-step','2');render()}});
(async()=>{try{await initDB();state={...blank(),...(await getState()||{}),dark:false};render()}catch(e){$('#app').innerHTML='<div class="onboard"><div class="card"><h2>Archivio non disponibile</h2><p>Per utilizzare ZAMP0 occorre un browser che consenta IndexedDB. Prova ad aprire il file in Chrome, Edge o Safari, senza navigazione privata.</p></div></div>'}})();

});
